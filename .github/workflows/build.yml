# Bauen und testen; bei einem Tag v<Version> den fertigen Plugin-Ordner als Release-Zip anhängen.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: brim-swyxit

      # Das Plugin baut gegen Brim.Sdk aus dem Brim-Repository, das daneben liegt.
      - uses: actions/checkout@v4
        with:
          repository: wheatley2056/brim
          ref: main
          path: brim

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        working-directory: brim-swyxit
        run: dotnet test tests/SwyxIt.Tests -c Release

      - name: Plugin-Ordner bauen
        working-directory: brim-swyxit
        run: dotnet publish src/SwyxIt -c Release -o artifacts/swyxit

      - name: Zip
        working-directory: brim-swyxit
        shell: pwsh
        run: Compress-Archive -Path artifacts/swyxit/* -DestinationPath artifacts/brim-swyxit.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: brim-swyxit
          path: brim-swyxit/artifacts/brim-swyxit.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: brim-swyxit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" artifacts/brim-swyxit.zip --title "SwyxIt!-Plugin ${{ github.ref_name }}" --generate-notes
